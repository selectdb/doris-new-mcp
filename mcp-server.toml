# =============================================================================
# mcp-server configuration file (TOML)
# =============================================================================
# Transport mode: streamable-http only.
# Values support ${VAR_NAME} environment-variable interpolation.

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
[server]
mcp_name = "doris-new-mcp"        # MCP service name
mcp_host = "0.0.0.0"              # HTTP listen address
mcp_port = 3000                   # HTTP listen port
fe_port = 9030                    # Doris FE MySQL port
fe_host = "127.0.0.1"             # Doris FE address; use the private FE IP or hostname for remote deployment

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
[logging]
level = "info"                    # debug / info / warning / error
audit_log = "./logs/audit.log"    # Audit log path
rotation_when = "midnight"        # Rotation policy: midnight / H / D / W0~W6
rotation_backup_count = 30        # Number of rotated files to keep

# ---------------------------------------------------------------------------
# Query
# ---------------------------------------------------------------------------
[query]
pool_min_size = 0                 # Minimum connection count (admin pool + per-user pool)
pool_max_size = 10                # Maximum connection count
pool_idle_timeout_seconds = 300   # Idle connection recycle timeout in seconds; as aiomysql pool_recycle, should be lower than Doris wait_timeout
query_timeout_seconds = 600       # SQL query timeout in seconds
query_max_rows = 10000            # Maximum rows returned by one query
db_whitelist = []                 # Database allow-list; empty means unrestricted
