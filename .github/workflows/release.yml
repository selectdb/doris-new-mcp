# =============================================================================
# Release — 打 tag 自动构建 linux x64 / arm64 并发布 GitHub Release
#
#   用法:  git tag doris-mcp-server-0.2.2 && git push origin doris-mcp-server-0.2.2
#
#   产物:  doris-mcp-server-0.2.2-linux-x64.tar.gz
#         doris-mcp-server-0.2.2-linux-arm64.tar.gz
#   解压后顶层目录均为 doris-mcp-server/（与 build.sh 原有约定一致）
#
#   说明:  私有仓库无免费 ARM runner，linux-arm64 在 x64 runner 上通过
#         build.sh 自带的交叉构建完成（pip --platform 解压 wheel）。
#         仓库转公开后可将 arm64 的 runner 换成 ubuntu-24.04-arm 原生构建。
# =============================================================================
name: Release

on:
  push:
    tags: ["doris-mcp-server-*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 0.2.2，不带前缀）"
        required: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x64, linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#doris-mcp-server-}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ${{ matrix.platform }}
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: ./build.sh ${{ matrix.platform }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: doris-mcp-server-${{ steps.ver.outputs.version }}-${{ matrix.platform }}
          path: dist/doris-mcp-server-${{ steps.ver.outputs.version }}-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: doris-mcp-server-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
